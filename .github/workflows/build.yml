name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Generer le wrapper Gradle
        run: gradle wrapper --gradle-version 8.7

      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest

      - name: Build APK debug
        run: ./gradlew assembleDebug

      - name: Renommer l'APK (nom de l'app + version)
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          mv app/build/outputs/apk/debug/app-debug.apk "DupScanner-v$VERSION.apk"

      - name: Publier l'artefact APK
        uses: actions/upload-artifact@v4
        with:
          name: DupScan-APK
          path: DupScanner-v*.apk
